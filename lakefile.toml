name = "MathlibPlus"
defaultTargets = ["MathlibPlus"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "MathlibPlus"
# A few modules in this tree elaborate into tens of gigabytes and will take a
# machine down with them (MathlibPlus/GroupTheory/Claim43656.lean wants ~13 GB
# on its own). The cap turns that into an ordinary build error for the one
# module instead of an OOM kill for the whole build.
moreLeanArgs = ["-M", "8192"]
